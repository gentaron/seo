<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まとめてコピー｜Undercurrent × AI Pulse</title>
<meta name="description" content="Undercurrent と AI Pulse の全情報を、Markdown でワンタップコピー。">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/eureka/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/icons/eureka/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/ai.css">
<link rel="stylesheet" href="/assets/copy.css">
<script src="/assets/ai-theme.js"></script>
</head>
<body>
<a class="skip" href="#main">本文へスキップ</a>
<nav class="gnav" aria-label="グローバル">
  <div class="gnav__in">
    <a class="gnav__back" href="/"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Undercurrent</a>
    <span class="gnav__brand">まとめてコピー</span>
    <div class="gnav__act">
      <a class="gnav__link" href="/ai/">AI Pulse</a>
      <button class="ibtn" id="theme" type="button" aria-label="配色を切り替え">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</nav>

<main id="main" class="wrap cp">
  <header class="cp-hero">
    <p class="eyebrow">EXPORT</p>
    <h1 class="cp-title">全部、ワンタップで。</h1>
    <p class="cp-lede">AI Pulse と Undercurrent の情報を、ひとつの Markdown にまとめてコピーします。<br class="pc">AI に貼って分析させたり、記事の下書きにそのまま使えます。</p>
  </header>

  <section class="cp-main" aria-label="コピー">
    <button class="cp-big" id="copy-all" type="button" disabled>
      <span class="cp-big__ic" aria-hidden="true">
        <svg class="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <svg class="i-done" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="cp-big__t" id="copy-all-label">読み込み中…</span>
      <span class="cp-big__s" id="copy-all-meta"></span>
    </button>
    <div class="cp-sub">
      <button class="pill" id="download" type="button" disabled>Markdown をダウンロード</button>
      <button class="pill" id="toggle-all" type="button">すべて選択を解除</button>
    </div>
    <p class="cp-time" id="stamp"></p>
  </section>

  <section aria-label="内訳" class="cp-list" id="list"></section>
</main>

<div class="toast" id="toast" role="status" hidden></div>
<footer class="foot"><div class="wrap"><p>コピー内容は各媒体の公開情報から自動で推定したものです。真偽・品質は一次情報で確認してください。</p><p class="foot__links"><a href="/">Undercurrent</a><a href="/ai/">AI Pulse</a><a href="/api/export?format=md" target="_blank" rel="noopener">Markdown を直接開く</a></p></div></footer>
<script type="module" src="/assets/copy.js"></script>
</body>
</html>
