# ---------------------------------------------------------------
# Undercurrent — Netlify 設定（無料プランの範囲で完結）
#   publish   : 静的フロント（public/）
#   functions : API + 3 時間ごとの定期観測（collect.mjs の config.schedule）
#   保存先     : Netlify Blobs（設定不要・無料）
# ---------------------------------------------------------------
[build]
  publish   = "public"
  functions = "netlify/functions"
  command   = "node scripts/build.mjs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# 旧名 /export/ → オールコピー
[[redirects]]
  from   = "/export/*"
  to     = "/all/"
  status = 301

# /api/* を Functions にマッピング
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options     = "nosniff"
    X-Frame-Options            = "SAMEORIGIN"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy    = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[dev]
  framework = "#static"
  publish   = "public"
  port      = 8888
